<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>IPLUS Player — HLS + DASH + ปรับขนาด</title>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
  
  <!-- 🔥 ไลบรารี HLS + DASH -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.21/dist/hls.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dashjs@4.7.4/dist/dash.all.min.js"></script>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: #0f172a;
      font-family: 'Prompt', sans-serif;
      color: #f8fafc;
      min-height: 100vh;
    }
    .page-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    h1 {
      text-align: center;
      margin-bottom: 15px;
      font-size: 22px;
      color: #4ade80;
    }
    .status-bar {
      width: 100%;
      max-width: 900px;
      padding: 12px 16px;
      background: #1e293b;
      border-radius: 10px;
      margin-bottom: 10px;
      font-size: 14px;
      color: #93c5fd;
      min-height: 44px;
      border-left: 4px solid #3b82f6;
    }
    .hint-box {
      width: 100%;
      max-width: 900px;
      padding: 10px 14px;
      background: rgba(251, 191, 36, 0.08);
      border: 1px solid #f59e0b;
      border-radius: 8px;
      margin-bottom: 10px;
      font-size: 13px;
      color: #fcd34d;
      line-height: 1.5;
    }
    .video-wrapper {
      width: 100%;
      max-width: 900px;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      border: 4px solid #e2e8f0;
      margin-bottom: 10px;
      position: relative;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    video {
      width: 100%;
      height: auto;
      aspect-ratio: 16/9;
      background: #000;
      display: block;
      transition: all 0.3s ease;
    }
    /* 🎯 โหมดปรับขนาดวิดีโอ */
    video.mode-contain { object-fit: contain; }  /* เต็มจอไม่ตัดภาพ มีขอบดำ */
    video.mode-cover  { object-fit: cover; }     /* เต็มจอ ไม่มีขอบ ตัดภาพ */
    video.mode-fill   { object-fit: fill; }      /* ขยายเต็มจอ อาจผิดสัดส่วน */
    video.mode-16-9   { object-fit: contain; aspect-ratio: 16/9; height: auto; }
    video.mode-4-3    { object-fit: contain; aspect-ratio: 4/3; height: auto; }

    /* 🎛️ ปุ่มควบคุมขนาด */
    .size-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-bottom: 15px;
      width: 100%;
      max-width: 900px;
    }
    .size-btn {
      background: #1e293b;
      color: #fff;
      padding: 8px 12px;
      border-radius: 8px;
      border: 2px solid #475569;
      cursor: pointer;
      font-family: 'Prompt', sans-serif;
      font-size: 13px;
      transition: all 0.2s;
    }
    .size-btn:hover, .size-btn.active {
      background: #334155;
      border-color: #4ade80;
      color: #4ade80;
    }

    .categories, .channels {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      width: 100%;
      max-width: 900px;
    }
    .channel-button {
      background: #1e293b;
      color: #fff;
      padding: 10px 12px;
      border-radius: 10px;
      border: 2px solid #475569;
      cursor: pointer;
      text-align: center;
      width: 130px;
      font-family: 'Prompt', sans-serif;
      outline: none;
      transition: all 0.2s;
    }
    .channel-button:hover,
    .channel-button:focus {
      background: #334155;
      border-color: #4ade80;
      transform: translateY(-2px);
    }
    .channel-button img {
      width: 42px;
      height: 42px;
      object-fit: contain;
      border-radius: 6px;
      margin-bottom: 6px;
      background: #fff;
    }
    .back-btn {
      background: #3b82f6;
      border-color: #2563eb;
    }
    @media (max-width: 600px) {
      .channel-button { width: 110px; font-size: 12px; padding: 8px; }
      .channel-button img { width: 36px; height: 36px; }
      .size-btn { font-size: 12px; padding: 6px 10px; }
    }
  </style>
</head>
<body>

  <div class="page-wrap">
    <h1>📺 IPTV Player — ปรับขนาดหน้าจอได้</h1>

    <div class="hint-box">
      ⚙️ เลือกโหมดแสดงภาพด้านล่าง: เต็มจอมีขอบ / เต็มจอไม่มีขอบ / ขยายเต็มจอ / อัตราส่วน 16:9 / 4:3
    </div>

    <div class="status-bar" id="statusBar">พร้อมทำงาน — เลือกช่องและปรับขนาดภาพตามต้องการ</div>

    <div class="video-wrapper">
      <video id="video"  class="mode-contain" controls
      source src="https://distributionsjustepourrire-justforlaughsgags-1-us.tcl.wurl.tv/playlist.m3u8" type="application/vnd.apple.mpegurl"></video>
     
    </div>

    <!-- 🎛️ ปุ่มปรับขนาดภาพ -->
    <div class="size-controls">
      <button class="size-btn active" data-mode="contain">มีขอบ</button>
      <button class="size-btn" data-mode="cover">ไม่มีขอบ</button>
      <button class="size-btn" data-mode="fill">ขยายเต็ม</button>
      <button class="size-btn" data-mode="16-9">16:9</button>
      <button class="size-btn" data-mode="4-3">4:3</button>
      <button class="size-btn" data-mode="full">⛶ เต็มจอ</button>
    </div>

    <div id="categories" class="categories"></div>
    <div id="channels" class="channels"></div>
  </div>

<script>
// ==============================================
// 📂 ข้อมูลช่อง
// ==============================================
const digitalTV = [
  { name: 'The GAGS',  logo: 'https://cdn.imgchest.com/files/a46aa3aae303.png', stream: 'https://corsproxy.io/?https://distributionsjustepourrire-justforlaughsgags-1-us.tcl.wurl.tv/playlist.m3u8' },
     { name: 'Thai Rath',   
    logo: 'https://goodiptv.site/images/tv/wIvpTVufwuomyCez38RtU10ql6ReqIX20240418191057thairahttvhd.jpg', 
    stream: 'https://udn-streamer1.cdn.3bbtv.com:8443/3bb/live/32/32.mpd' 
  },
       { name: 'Thai Rath2',   
    logo: 'https://goodiptv.site/images/tv/wIvpTVufwuomyCez38RtU10ql6ReqIX20240418191057thairahttvhd.jpg', 
    stream: 'http://45.144.166.242:1935/ThairathTV/t3_thairathtv/playlist.m3u8' 
  },
    { name: 'ช่อง8',    logo: 'https://gigatv.3bbtv.co.th/wp-content/themes/changwattana/assets/channel/27.png', stream: 'https://udn-streamer1.cdn.3bbtv.com:8443/3bb/live/27/27.mpd' },
    { name: 'Thai PBS',    logo: 'https://gigatv.3bbtv.co.th/wp-content/themes/changwattana/assets/channel/23.png', stream: 'https://udn-streamer1.cdn.3bbtv.com:8443/3bb/live/23/23.mpd' },
      { name: 'AmarinTV HD.th',    logo: 'https://gigatv.3bbtv.co.th/wp-content/themes/changwattana/assets/channel/34.png', stream: 'https://udn-streamer1.cdn.3bbtv.com:8443/3bb/live/34/34.mpd' },
        { name: 'Thai PBS',    logo: 'https://gigatv.3bbtv.co.th/wp-content/themes/changwattana/assets/channel/27.png', stream: 'https://udn-streamer1.cdn.3bbtv.com:8443/3bb/live/27/27.mpd' },
          { name: 'Thai PBS',    logo: 'https://gigatv.3bbtv.co.th/wp-content/themes/changwattana/assets/channel/27.png', stream: 'https://udn-streamer1.cdn.3bbtv.com:8443/3bb/live/27/27.mpd' },
  { name: '🔴Live Thai Rath', logo: 'https://goodiptv.site/images/tv/wIvpTVufwuomyCez38RtU10ql6ReqIX20240418191057thairahttvhd.jpg', stream: 'https://manifest.googlevideo.com/api/manifest/hls_variant/file/index.m3u8?expire=1786906612&ei=lLOBaoLFLs_BssUPqPHFYA&ip=223.24.139.85&id=O2QAjyUgnmA.1&source=yt_live_broadcast&requiressl=yes&xpc=EgVo2aDSNQ%3D%3D&hfr=1&maxh=4320&playlist_duration=30&manifest_duration=30&maudio=1&siu=1&bui=AR3QkAkfont_pqYYWE7u8hXShZWyFFyvMD3Yjl4BRW5k89xkjltWgUvTnmFYo_gTVLIylycI8g&spc=KBGBcpxUjFhOGMuFzUhh3tZrDkvfhhFnGUoghsALEji1pbSz6m2i5_G97B09ryeksREGFRYiD58&vprv=1&go=1&ns=CXOOHn207f_T3FHKox-hpXoX&rqh=5&reg=0&pacing=0&nvgoi=1&ncsapi=1&keepalive=yes&fexp=51565116%2C51946838%2C51973818%2C52089683&dover=11&n=iTnAYqP-FvzSZw&itag=0&playlist_type=DVR&sparams=expire%2Cei%2Cip%2Cid%2Csource%2Crequiressl%2Cxpc%2Chfr%2Cmaxh%2Cplaylist_duration%2Cmanifest_duration%2Cmaudio%2Csiu%2Cbui%2Cspc%2Cvprv%2Cgo%2Cns%2Crqh%2Creg%2Citag%2Cplaylist_type&sig=AE0s2JYwRQIhANCqzFvrILIpqzFkXULgPyODz6B5uFTN5ymiSsqQ3g2MAiBiy65D3CMHwyHvLbl8mzElEjOFU-2b_BPp4VdXEQhZaw%3D%3D&cpn=DKYQeg0Zb8ReJDk7&ibw=3010000&c=MWEB&cver=2.20260813.02.00&ptk=youtube_single&oid=6tGFEVDsxneJqsVjifQvEA&ptchn=rFDdD-EE05N7gjwZho2wqw&pltype=contentlive'
  },
    { name: 'CH8',   logo: 'https://cdn.imgchest.com/files/a46aa3aae303.png', stream: 'https://udn-streamer1.cdn.3bbtv.com:8443/3bb/live/27/27.mpd' },
  // ✅ เพิ่มช่องอื่นๆ และลิงก์ .mpd ได้ที่นี่ครับ
  // { name: 'ตัวอย่าง DASH', logo: '...', stream: 'https://example.com/live/manifest.mpd' },
];
const documentary = [
            { name: 'Animal',   logo: 'https://i.postimg.cc/rFscPFcF/IMG-2948.png', stream: 'http://49.0.64.96:8007/Animal' },
        { name: 'สำรวจโลก',   logo: 'https://cdn.imgchest.com/files/5944e14c1b6f.webp', stream: 'https://cdn2.stream.atmflix.live/atmflixlive/samrujlok/playlist.m3u8' },
  // ✅ เพิ่มช่องอื่นๆ และลิงก์ .mpd ได้ที่นี่ครับ
  // { name: 'ตัวอย่าง DASH', logo: '...', stream: 'https://example.com/live/manifest.mpd' },
];
const entertainment = [];

const categories = [
  { name: '📺 ทีวีดิจิทัล', channels: digitalTV },
  { name: '📖 สารคดี', channels: documentary },
  { name: '🎉 บันเทิง', channels: entertainment },
];

// ==============================================
// 🎯 ตัวแปร
// ==============================================
const video = document.getElementById('video');
const statusBar = document.getElementById('statusBar');
const categoriesDiv = document.getElementById('categories');
const channelsDiv = document.getElementById('channels');
const sizeButtons = document.querySelectorAll('.size-btn');
let hls = null, dashPlayer = null;

// ==============================================
// 🎛️ เปลี่ยนโหมดขนาดภาพ
// ==============================================
function setVideoSizeMode(mode) {
  // ลบคลาสเดิม
  video.classList.remove('mode-contain','mode-cover','mode-fill','mode-16-9','mode-4-3');
  sizeButtons.forEach(btn => btn.classList.toggle('active', btn.dataset.mode === mode));

  if (mode === 'full') {
    // เปิดโหมดเต็มจอ
    if (video.requestFullscreen) video.requestFullscreen();
    else if (video.webkitRequestFullscreen) video.webkitRequestFullscreen();
    return;
  }

  // ตั้งค่าโหมดใหม่
  video.classList.add(`mode-${mode}`);
  const labels = { contain:'มีขอบดำ', cover:'เต็มจอไม่มีขอบ', fill:'ขยายเต็มจอ', '16-9':'16:9 มาตรฐาน', '4-3':'4:3 แบบเก่า' };
  statusBar.textContent = `✅ โหมด: ${labels[mode]}`;
}

// ผูกเหตุการณ์ปุ่มปรับขนาด
sizeButtons.forEach(btn => {
  btn.addEventListener('click', () => setVideoSizeMode(btn.dataset.mode));
});

// ==============================================
// 🔍 ตรวจสอบประเภทสตรีม
// ==============================================
function getStreamType(url) {
  const lower = url.toLowerCase();
  if (lower.includes('.m3u8')) return 'hls';
  if (lower.includes('.mpd')) return 'dash';
  return 'unknown';
}

// ==============================================
// ▶️ เล่นช่อง
// ==============================================
function playChannel(channel) {
  statusBar.textContent = `⏳ กำลังโหลด: ${channel.name}...`;
  stopVideo();
  const type = getStreamType(channel.stream);
  if (type === 'hls') playHLS(channel);
  else if (type === 'dash') playDASH(channel);
  else statusBar.textContent = `❌ ไม่รู้จักประเภทสตรีม`;
}

function playHLS(channel) {
  // ลองใช้โหมดเนทีฟก่อน (ข้าม CORS ในบางกรณี)
  if (video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = channel.stream;
    video.play().catch(() => {});
    statusBar.textContent = `✅ [HLS-Native] กำลังเล่น: ${channel.name}`;
    return;
  }
  // ถ้าไม่ได้ ค่อยใช้ hls.js
  if (Hls.isSupported()) {
    // ... โค้ด hls.js เหมือนเดิม
  }
}

function playDASH(channel) {
  dashPlayer = dashjs.MediaPlayer().create();
  dashPlayer.initialize(video, channel.stream, true);
  dashPlayer.on('streamInitialized', () => statusBar.textContent = `✅ [DASH] กำลังเล่น: ${channel.name}`);
  dashPlayer.on('error', () => statusBar.textContent = `❌ DASH เล่นไม่ได้: ${channel.name}`);
}

function stopVideo() {
  if (hls) { hls.destroy(); hls=null; }
  if (dashPlayer) { dashPlayer.reset(); dashPlayer=null; }
  video.removeAttribute('src'); video.load();
}



// ==============================================
// 📂 แสดงหมวดหมู่และช่อง
// ==============================================
function renderCategories() {
  categoriesDiv.innerHTML = channelsDiv.innerHTML = '';
  categories.forEach(cat => {
    const btn = Object.assign(document.createElement('div'), { className:'channel-button', innerHTML:`${cat.name} (${cat.channels.length})` });
    btn.onclick = () => renderChannels(cat);
    categoriesDiv.appendChild(btn);
  });
}

function renderChannels(category) {
  categoriesDiv.innerHTML = channelsDiv.innerHTML = '';
  category.channels.forEach((ch,i) => {
    const btn = document.createElement('div');
    btn.className = 'channel-button';
    btn.innerHTML = `<img src="${ch.logo}" alt="${ch.name}" loading="lazy" onerror="this.src='https://via.placeholder.com/42?text=📺'"><div style="font-size:12px">${i+1}. ${ch.name}</div>`;
    btn.onclick = () => playChannel(ch);
    channelsDiv.appendChild(btn);
  });
  const backBtn = Object.assign(document.createElement('div'), { className:'channel-button back-btn', innerHTML:'🔙 ย้อนกลับ' });
  backBtn.onclick = renderCategories;
  channelsDiv.appendChild(backBtn);
}

renderCategories();
</script>
</body>
</html>
